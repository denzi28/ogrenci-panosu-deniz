<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eldeli toplama</title>
<link rel="stylesheet" href="motor/oyun.css">
<style>
    .duzen { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(14px, 3vw, 28px); align-items: center; }
    @media (max-width: 700px) { .duzen { grid-template-columns: 1fr; } }
    .sure { height: 12px; border-radius: 6px; background: #fff; box-shadow: inset 0 0 0 2px var(--renk-acik); overflow: hidden; margin-bottom: 12px; }
    .sure span { display: block; height: 100%; background: var(--dogru); transform-origin: left; transition: transform 1s linear, background-color 300ms; }
    .sure.az span { background: #f59e0b; }
    .sure.cok-az span { background: var(--yanlis); }
    .tablo { display: grid; grid-template-columns: 1fr repeat(2, clamp(64px, 12vw, 96px)); justify-content: center; align-items: center; gap: 6px 10px; font-size: clamp(48px, 9vw, 76px); font-weight: 600; width: max-content; margin: 0 auto; }
    .tablo .etiket { font-size: 14px; color: var(--soluk); font-weight: 500; text-align: center; }
    .tablo .arti { color: var(--renk); text-align: right; }
    .tablo .sayi { text-align: center; }
    .elde { height: 44px; display: grid; place-items: center; }
    .elde span { width: 40px; height: 40px; border-radius: 50%; background: #f59e0b; color: #fff; font-size: 26px; display: grid; place-items: center; opacity: 0; transform: scale(.4); transition: opacity 200ms, transform 300ms var(--yay); }
    .elde span.var { opacity: 1; transform: scale(1); }
    .cizgi { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--murekkep); }
    .hucre { height: clamp(76px, 13vw, 100px); border-radius: 18px; border: 4px dashed #d6cfe2; display: grid; place-items: center; color: var(--murekkep); background: #fff; }
    .hucre.aktif { border-color: var(--renk); background: var(--renk-acik); animation: nabiz 1.2s ease-in-out 3; }
    .hucre.dolu { border-style: solid; border-color: var(--dogru); background: var(--dogru-acik); color: var(--dogru); animation: none; }
    .hucre.cevap { border-color: var(--yanlis); color: var(--yanlis); background: var(--yanlis-acik); }
    .yonerge { text-align: center; font-size: clamp(17px, 2.6vw, 21px); color: var(--renk-koyu); margin-top: 12px; min-height: 1.4em; font-weight: 500; }
    .ucan-elde { position: fixed; z-index: 80; width: 40px; height: 40px; border-radius: 50%; background: #f59e0b; color: #fff; font: 600 26px/40px 'Fredoka', sans-serif; text-align: center; pointer-events: none; transition: transform 700ms var(--yay); }
</style>
</head>
<body>
<script type="module">
import { Oyun, tusTakimi, rastgele, ses, oynat } from './motor/oyun.js';

// Eski kurallar: doğru +10, yanlış rakam -2, süre biterse -5. Süre puan arttıkça kısalır (60 sn'den 10 sn'ye).
// Puan sınırı yok; öğrenci istediği zaman "Bitir" ile puanını kaydeder.
let p = {}, adim = 'birler', zamanlayici = null, kalan = 60, enCok = 60;

const oyun = new Oyun({
    baslik: 'Eldeli toplama', maskot: '🐿️', renk: '#0ea5e9',
    nasil: 'Önce birler basamağını topla. 10 ya da daha fazla çıkarsa 1 elde onlar basamağına uçar. Sonra onlar basamağını topla, eldeyi unutma',
    hedefYazi: 'Her doğru 10 puan · istediğin zaman Bitir',
    ilerlemeTuru: null, bitirDugmesi: true,
    baslat: () => {
        oyun.alan.innerHTML = `
            <div class="duzen">
                <div class="soru-kart">
                    <div class="sure" id="sure"><span></span></div>
                    <div class="tablo">
                        <span></span><span class="etiket">Onlar</span><span class="etiket">Birler</span>
                        <span></span><div class="elde"><span id="elde">1</span></div><span></span>
                        <span></span><span class="sayi" id="t1"></span><span class="sayi" id="o1"></span>
                        <span class="arti">+</span><span class="sayi" id="t2"></span><span class="sayi" id="o2"></span>
                        <div class="cizgi"></div>
                        <span></span><div class="hucre" id="h-onlar"></div><div class="hucre" id="h-birler"></div>
                    </div>
                    <div class="yonerge" id="yonerge"></div>
                </div>
                <div id="tuslar"></div>
            </div>`;
        tusTakimi(oyun.alan.querySelector('#tuslar'), { tusla: gir, sil: () => {} });
        yeniSoru();
    },
});
const $ = (id) => oyun.alan.querySelector('#' + id);

function yeniSoru() {
    const o1 = rastgele(2, 9), o2 = rastgele(10 - o1, 9);   // birler toplamı en az 10 (elde olsun)
    const t1 = rastgele(1, 6), t2 = rastgele(1, 8 - t1);      // onlar toplamı (elde dahil) tek basamak kalsın
    p = { t1, o1, t2, o2, birler: (o1 + o2) % 10, onlar: t1 + t2 + 1 };
    ['t1', 'o1', 't2', 'o2'].forEach(k => { $(k).textContent = p[k]; });
    $('h-birler').textContent = ''; $('h-onlar').textContent = '';
    $('h-birler').className = 'hucre aktif'; $('h-onlar').className = 'hucre';
    $('elde').classList.remove('var');
    adim = 'birler';
    $('yonerge').textContent = `Önce birler: ${o1} + ${o2} = ?  (sadece birler basamağını yaz)`;
    oynat(oyun.alan.querySelector('.soru-kart'), 'gelis');
    sureBaslat();
}

function sureBaslat() {
    clearInterval(zamanlayici);
    enCok = Math.max(10, 60 - Math.floor(oyun.puan / 10));
    kalan = enCok; sureCiz();
    zamanlayici = setInterval(() => { kalan--; sureCiz(); if (kalan <= 0) sureBitti(); if (kalan > 0 && kalan <= 3) ses.uyari(); }, 1000);
}
function sureCiz() {
    const oran = kalan / enCok;
    $('sure').querySelector('span').style.transform = `scaleX(${oran})`;
    $('sure').className = `sure${oran <= 0.2 ? ' cok-az' : oran <= 0.5 ? ' az' : ''}`;
}

function gir(n) {
    if (oyun.bitti || adim === 'bekle') return;
    const hucre = $(adim === 'birler' ? 'h-birler' : 'h-onlar');
    const dogru = adim === 'birler' ? p.birler : p.onlar;
    hucre.textContent = n;
    if (n !== dogru) {
        oyun.yanlis(hucre, { ceza: 2 });
        setTimeout(() => { if (hucre.textContent == n && !hucre.classList.contains('dolu')) hucre.textContent = ''; }, 400);
        return;
    }
    hucre.className = 'hucre dolu';
    oynat(hucre, 'zipla');
    if (adim === 'birler') {
        ses.dogru(1);
        adim = 'bekle';
        eldeUcur(() => {
            adim = 'onlar';
            $('h-onlar').classList.add('aktif');
            $('yonerge').textContent = `Şimdi onlar: 1 (elde) + ${p.t1} + ${p.t2} = ?`;
        });
    } else {
        clearInterval(zamanlayici);
        adim = 'bekle';
        oyun.dogru(oyun.alan.querySelector('.tablo'), { puan: 10 });
        $('yonerge').textContent = `${p.t1}${p.o1} + ${p.t2}${p.o2} = ${p.onlar}${p.birler}`;
        setTimeout(yeniSoru, 1400);
    }
}

// Birler hücresinden onlar sütununun üstüne uçan "1"
function eldeUcur(bitince) {
    $('yonerge').textContent = '1 elde onlar basamağına gidiyor';
    const bas = $('h-birler').getBoundingClientRect(), son = $('elde').getBoundingClientRect();
    const u = document.createElement('div');
    u.className = 'ucan-elde'; u.textContent = '1';
    u.style.left = `${bas.left + bas.width / 2 - 20}px`; u.style.top = `${bas.top + bas.height / 2 - 20}px`;
    document.body.appendChild(u);
    requestAnimationFrame(() => requestAnimationFrame(() => {
        u.style.transform = `translate(${son.left + son.width / 2 - (bas.left + bas.width / 2)}px, ${son.top + son.height / 2 - (bas.top + bas.height / 2)}px)`;
    }));
    ses.nota(400, { sure: 0.3, kayma: 800 });
    setTimeout(() => { u.remove(); $('elde').classList.add('var'); bitince(); }, 720);
}

function sureBitti() {
    clearInterval(zamanlayici);
    adim = 'bekle';
    $('h-birler').textContent = p.birler; $('h-onlar').textContent = p.onlar;
    $('h-birler').className = 'hucre cevap'; $('h-onlar').className = 'hucre cevap';
    $('elde').classList.add('var');
    $('yonerge').textContent = 'Süre doldu! Doğrusu bu';
    oyun.yanlis(null, { ceza: 5 });
    setTimeout(yeniSoru, 2200);
}

// Bitir düğmesi (motorda) süreyi de durdursun
document.addEventListener('click', (e) => { if (e.target.closest('.bitir-dugme')) setTimeout(() => { if (oyun.bitti) clearInterval(zamanlayici); }, 0); });
</script>
</body>
</html>
