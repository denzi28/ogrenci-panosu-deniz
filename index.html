<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3/D Sınıfı Panosu</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <header class="top-header">
        <div class="header-left">
            <button id="mobile-menu-btn" class="hamburger-btn">☰</button>
            <h1>Sınıf Panosu</h1>
        </div>
        <!-- Butona id="auth-btn" ekledik ki JavaScript ile kontrol edebilelim -->
        <a href="login.html" id="auth-btn" class="btn btn-primary">Sisteme Giriş Yap</a>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <nav id="menu-container"></nav>
        </aside>
        <main id="app-content" class="content-area">
            <div class="card">
                <h2>Sınıfımıza Hoş Geldiniz!</h2>
                <p>Soldaki menüden herkese açık duyuru ve etkinlikleri inceleyebilirsiniz.</p>
            </div>
        </main>
    </div>

    <script type="module">
        import { initApp } from './js/app.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            const kayitliKullanici = localStorage.getItem('currentUser');
            const sonGiris = localStorage.getItem('sonGirisTarihi');
            const HAFTA_MILISANIYE = 7 * 24 * 60 * 60 * 1000;
            const simdi = Date.now();

            // Eğer kişi daha önce giriş yapmışsa ve 1 haftası dolmamışsa...
            if (kayitliKullanici && sonGiris && (simdi - parseInt(sonGiris) <= HAFTA_MILISANIYE)) {
                const user = JSON.parse(kayitliKullanici);
                
                // Sağ üstteki butonu değiştir ve kişiyi panosuna yönlendir
                const authBtn = document.getElementById('auth-btn');
                if (authBtn) {
                    authBtn.innerText = 'Panoma Git ➔';
                    authBtn.href = user.role === 'teacher' ? 'teacher.html' : 'student.html';
                    authBtn.style.backgroundColor = '#10b981'; // Yeşil renk
                    authBtn.style.boxShadow = '0 4px 0 #059669';
                }
            }

            // Sınıf panosu anasayfasının sol menüsünü çizmesi için başlat
            initApp('guest');
        });
    </script>
</body>
</html>
