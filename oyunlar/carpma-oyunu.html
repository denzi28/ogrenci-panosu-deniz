<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matematik Bahçesi: Çarpma Oyunu</title>
    <style>
        :root {
            --bg-color: #f0fdf4;
            --primary-color: #4ade80;
            --secondary-color: #fbbf24;
            --accent-color: #3b82f6;
            --text-color: #1f2937;
            --wrong-color: #ef4444;
            --correct-color: #10b981;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #dcfce7 0%, #fef9c3 100%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        /* Üst Bilgi Çubuğu */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 15px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Kaydet ve Çık Butonu */
        .logout-btn {
            font-size: 0.9rem;
            background: var(--accent-color);
            color: white;
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            box-shadow: 0 4px 0 #2563eb;
            transition: transform 0.1s;
        }
        .logout-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* Soru Alanı */
        .question-box {
            background: white;
            padding: 30px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .question-text {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .answer-display {
            min-width: 80px;
            height: 80px;
            border-bottom: 5px solid var(--secondary-color);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5rem;
            color: var(--text-color);
        }

        /* Sanal Tuş Takımı */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .num-btn {
            background: white;
            border: none;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 15px;
            box-shadow: 0 4px 0 #e5e7eb;
            cursor: pointer;
            transition: all 0.1s;
            color: var(--text-color);
        }

        .num-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #e5e7eb;
        }

        .num-btn.action {
            background-color: var(--secondary-color);
            color: white;
            box-shadow: 0 4px 0 #d97706;
        }

        .num-btn.check {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 0 #059669;
            grid-column: span 3;
            margin-top: 5px;
            padding: 25px;
        }

        .span-2 {
            grid-column: span 2;
        }

        /* Animasyonlar */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
            border: 2px solid var(--wrong-color);
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .pop {
            animation: pop 0.4s ease-out;
        }

        /* Geri Bildirim Mesajı */
        #feedback {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.5rem;
            color: white;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        /* Konfeti için canvas */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="feedback"></div>

    <div id="game-container">
        <div class="stats-bar">
            <div class="stat-item">
                <span>⭐</span>
                <!-- Hedef 500 Puan Olarak Gösteriliyor -->
                <span id="score">0 / 500</span>
            </div>
            <!-- Erken Çıkmak İsteyenler İçin Buton -->
            <button class="logout-btn" onclick="kaydetVeCik()">Kaydet ve Çık</button>
            <div class="stat-item">
                <span>🔥</span>
                <span id="streak">0</span>
            </div>
        </div>

        <div class="question-box" id="question-box">
            <div class="question-text">
                <span id="num1">?</span>
                <span>×</span>
                <span id="num2">?</span>
                <span>=</span>
                <div class="answer-display" id="answer-text"></div>
            </div>
        </div>

        <div class="numpad">
            <button class="num-btn" onclick="addNumber(1)">1</button>
            <button class="num-btn" onclick="addNumber(2)">2</button>
            <button class="num-btn" onclick="addNumber(3)">3</button>
            <button class="num-btn" onclick="addNumber(4)">4</button>
            <button class="num-btn" onclick="addNumber(5)">5</button>
            <button class="num-btn" onclick="addNumber(6)">6</button>
            <button class="num-btn" onclick="addNumber(7)">7</button>
            <button class="num-btn" onclick="addNumber(8)">8</button>
            <button class="num-btn" onclick="addNumber(9)">9</button>
            <button class="num-btn action" onclick="clearAnswer()">C</button>
            <button class="num-btn span-2" onclick="addNumber(0)">0</button>
            <button class="num-btn check" onclick="checkAnswer()">KONTROL ET</button>
        </div>
    </div>

    <script>
        let score = 0;
        let streak = 0;
        let currentNum1 = 0;
        let currentNum2 = 0;
        let userAnswer = "";
        const HEDEF_PUAN = 500; // Yeni Hedef Sınırı

        const scoreEl = document.getElementById('score');
        const streakEl = document.getElementById('streak');
        const num1El = document.getElementById('num1');
        const num2El = document.getElementById('num2');
        const answerEl = document.getElementById('answer-text');
        const questionBox = document.getElementById('question-box');
        const feedbackEl = document.getElementById('feedback');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // YENİ SİSTEM ENTEGRASYONU: KAYDET VE ÇIK
        function kaydetVeCik() {
            window.parent.postMessage({ islem: 'gorev_bitti', puan: score, limit: HEDEF_PUAN }, '*');
            
            document.getElementById('game-container').innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; text-align: center;">
                    <h2 style="color: var(--primary-color); font-size: 2.5rem; margin-bottom: 10px;">Harika! 🎉</h2>
                    <p style="font-size: 1.5rem; margin: 10px 0; color: var(--text-color);">Kazanılan Puan: <strong style="color: var(--accent-color); font-size: 3rem;">${score}</strong></p>
                    <p style="color: #666; font-size: 1rem; margin-top: 20px;">Sonucunuz kaydedildi.<br>Pencere kapatılıyor...</p>
                </div>
            `;
            
            for(let i=0; i<3; i++) {
                setTimeout(createConfetti, i*300);
            }
            if(particles.length === 0) updateConfetti();
        }

        // Konfeti Ayarları
        let particles = [];
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: -10,
                    size: Math.random() * 8 + 4,
                    color: `hsl(${Math.random() * 360}, 70%, 60%)`,
                    speedY: Math.random() * 3 + 2,
                    speedX: Math.random() * 4 - 2,
                    rotation: Math.random() * 360
                });
            }
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.y += p.speedY;
                p.x += p.speedX;
                p.rotation += 5;
                
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                ctx.restore();

                if (p.y > canvas.height) particles.splice(index, 1);
            });
            if (particles.length > 0) requestAnimationFrame(updateConfetti);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Oyun Mantığı
        function generateQuestion() {
            currentNum1 = Math.floor(Math.random() * 10) + 1;
            currentNum2 = Math.floor(Math.random() * 5) + 1;
            
            num1El.innerText = currentNum1;
            num2El.innerText = currentNum2;
            userAnswer = "";
            answerEl.innerText = "";
            questionBox.classList.remove('shake', 'pop');
        }

        function addNumber(n) {
            if (userAnswer.length < 3) {
                userAnswer += n;
                answerEl.innerText = userAnswer;
            }
        }

        function clearAnswer() {
            userAnswer = "";
            answerEl.innerText = "";
        }

        function showFeedback(text, color) {
            feedbackEl.innerHTML = text;
            feedbackEl.style.backgroundColor = color;
            feedbackEl.style.display = 'block';
            setTimeout(() => {
                feedbackEl.style.display = 'none';
            }, 2000);
        }

        function checkAnswer() {
            if (userAnswer === "") return;

            const correctResult = currentNum1 * currentNum2;
            
            if (parseInt(userAnswer) === correctResult) {
                score += 10 + (streak * 2);
                streak++;
                scoreEl.innerText = score + " / " + HEDEF_PUAN;
                streakEl.innerText = streak;
                
                questionBox.classList.add('pop');
                
                // HEDEF PUAN KONTROLÜ
                if (score >= HEDEF_PUAN) {
                    showFeedback("GÖREV TAMAMLANDI! 🏆<br><small>Puanınız kaydediliyor...</small>", "var(--accent-color)");
                    createConfetti();
                    if(particles.length <= 50) updateConfetti();
                    
                    // 2 Saniye sonra otomatik kaydet ve çık
                    setTimeout(kaydetVeCik, 2000);
                    return; 
                }

                showFeedback("Harika! 🌟", "var(--correct-color)");
                createConfetti();
                if(particles.length <= 50) updateConfetti();
                
                setTimeout(generateQuestion, 1000);
            } else {
                streak = 0;
                streakEl.innerText = streak;
                questionBox.classList.add('shake');
                showFeedback("Tekrar Dene! 💪", "var(--wrong-color)");
                
                setTimeout(() => {
                    questionBox.classList.remove('shake');
                    clearAnswer();
                }, 500);
            }
        }

        generateQuestion();
    </script>
</body>
</html>
