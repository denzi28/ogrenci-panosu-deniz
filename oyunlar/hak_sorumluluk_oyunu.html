<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hak mı, sorumluluk mu?</title>
<link rel="stylesheet" href="motor/oyun.css">
</head>
<body>
<script type="module">
import { secmeli, karistir } from './motor/oyun.js';

// Cümleler ve hak mı sorumluluk mu oldukları (öğretmenin listesi)
const SORULAR = [
        { metin: "Derslere katılıp, yeni bilgiler öğrenerek kendimizi geliştiririz.", tur: "hak" },
        { metin: "Okula ve derse zamanında geliriz. Öğretmenimizi dikkatlice dinleriz.", tur: "sorumluluk" },
        { metin: "Sınıfımızın ve okulumuzun kurallarına uyarız.", tur: "sorumluluk" },
        { metin: "Teneffüslerde oyunlar oynayabilir, bahçede dinlenebiliriz.", tur: "hak" },
        { metin: "Okulun masa, sıra ve diğer araçlarını temiz ve dikkatli kullanırız.", tur: "sorumluluk" },
        { metin: "Okulda kendimizi güvende hissederiz. Tehlikelere karşı önlem alınır.", tur: "hak" },
        { metin: "Kuralları belirlerken görüşlerimizi belirtir, oy kullanırız.", tur: "hak" },
        { metin: "Arkadaşlarımızla olumlu iletişim kurar, zarar verecek davranışlardan kaçınırız.", tur: "sorumluluk" },
        { metin: "Temiz bir okulumuz ve sağlıklı bir sınıf ortamımız vardır.", tur: "hak" },
        { metin: "Çöpleri çöp kutusuna atar, sınıfımızı temiz tutarız.", tur: "sorumluluk" }
];

secmeli({
    baslik: 'Hak mı, sorumluluk mu?', maskot: '🦁', renk: '#2563eb',
    nasil: 'Cümle bir hakkımızı mı, yoksa sorumluluğumuzu mu anlatıyor? Doğru bilince 10 puan, yanlışta 5 puan gider',
    hedefYazi: 'Hedef: 100 puan',
    mod: 'hedef', hedef: 100, limit: 100, dogruPuan: 10, yanlisCeza: 5, soruBoyu: 'metin', duzen: 'iki',
    sorular: () => karistir(SORULAR).map(s => ({
        soru: s.metin, dogru: s.tur,
        secenekler: [
            { deger: 'hak', yazi: '🛡️ Hakkımız', renk: '#2563eb' },
            { deger: 'sorumluluk', yazi: '✅ Sorumluluğumuz', renk: '#16a34a' },
        ],
    })),
});
</script>
</body>
</html>
