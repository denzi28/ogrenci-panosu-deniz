<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matematik bahçesi: çarpma</title>
<link rel="stylesheet" href="motor/oyun.css">
<style>
    .islem { display: flex; align-items: center; justify-content: center; gap: .35em; font-size: clamp(48px, 11vw, 96px); font-weight: 600; }
    .islem .x { color: var(--renk); }
    .cevap-kutu { min-width: 2.2em; height: 1.3em; border-radius: 22px; border: 5px dashed var(--renk); display: inline-grid; place-items: center; color: var(--renk); background: var(--renk-acik); }
    .cevap-kutu.dolu { border-style: solid; }
    .soru-kart.dogru-oldu .cevap-kutu { border-color: var(--dogru); background: var(--dogru-acik); color: var(--dogru); }
    .ipucu { margin-top: 10px; font-size: clamp(16px, 2.4vw, 20px); color: var(--soluk); min-height: 1.4em; }
    .bonus { color: #c2410c; font-weight: 600; }
</style>
</head>
<body>
<script type="module">
import { Oyun, tusTakimi, rastgele, oynat } from './motor/oyun.js';

const HEDEF_PUAN = 500;
let a = 0, b = 0, cevap = '', kilit = false;

const oyun = new Oyun({
    baslik: 'Matematik bahçesi: çarpma', maskot: '🐝', renk: '#f59e0b',
    nasil: 'Çarpma işleminin sonucunu yaz. Üst üste doğru bildikçe seri bonusu kazanırsın',
    hedefYazi: 'Hedef: 500 puan · doğru başına 10 puan + seri bonusu',
    toplam: HEDEF_PUAN, ilerlemeTuru: 'puan', limit: HEDEF_PUAN, bitirDugmesi: true, canliKayit: true,
    baslat: () => {
        oyun.alan.innerHTML = `
            <div class="soru-kart">
                <div class="soru-ust">Sonuç kaç?</div>
                <div class="islem"><span id="a"></span><span class="x">×</span><span id="b"></span><span>=</span><span class="cevap-kutu" id="cevap"></span></div>
                <div class="ipucu" id="ipucu"></div>
            </div>
            <div id="tuslar"></div>`;
        tusTakimi(oyun.alan.querySelector('#tuslar'), {
            tusla: (n) => { if (!kilit && cevap.length < 3) { cevap += n; ciz(); } },
            sil: () => { if (!kilit) { cevap = cevap.slice(0, -1); ciz(); } },
            tamam: kontrol,
        });
        yeniSoru();
    },
});

function ciz() {
    const kutu = oyun.alan.querySelector('#cevap');
    kutu.textContent = cevap || '?';
    kutu.classList.toggle('dolu', !!cevap);
}

function yeniSoru() {
    a = rastgele(1, 10); b = rastgele(1, 5); cevap = ''; kilit = false;
    oyun.alan.querySelector('#a').textContent = a;
    oyun.alan.querySelector('#b').textContent = b;
    oyun.alan.querySelector('.soru-kart').classList.remove('dogru-oldu');
    oyun.alan.querySelector('#ipucu').textContent = oyun.seri >= 2 ? `Seri bonusu: +${oyun.seri * 2}` : '';
    ciz();
    oynat(oyun.alan.querySelector('.soru-kart'), 'gelis');
}

function kontrol() {
    if (kilit || !cevap || oyun.bitti) return;
    const kart = oyun.alan.querySelector('.soru-kart');
    if (+cevap === a * b) {
        kilit = true;
        const kazanc = 10 + oyun.seri * 2; // eski kural: 10 + seri × 2
        kart.classList.add('dogru-oldu');
        oyun.dogru(oyun.alan.querySelector('#cevap'), { puan: kazanc });
        if (oyun.puan >= HEDEF_PUAN) return setTimeout(() => oyun.bitir(), 900);
        setTimeout(yeniSoru, 900);
    } else {
        oyun.yanlis(kart);
        oyun.alan.querySelector('#ipucu').innerHTML = `İpucu: ${a} tane ${b} topla`;
        setTimeout(() => { cevap = ''; ciz(); }, 450);
    }
}
</script>
</body>
</html>
