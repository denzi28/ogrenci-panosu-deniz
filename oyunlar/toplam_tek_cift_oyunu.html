<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toplam tek mi, çift mi?</title>
<link rel="stylesheet" href="motor/oyun.css">
</head>
<body>
<script type="module">
import { secmeli, rastgele } from './motor/oyun.js';

secmeli({
    baslik: 'Toplam tek mi, çift mi?', maskot: '🐢', renk: '#0891b2',
    nasil: 'İki sayının toplamı tek mi, çift mi? İpucu: sadece son basamakları toplaman yeter',
    hedefYazi: '10 soru · geçmek için en az 60 puan',
    soruSayisi: 10, limit: 100, dogruPuan: 10, baraj: 60, duzen: 'iki',
    sorular: () => Array.from({ length: 10 }, () => {
        const a = rastgele(10, 999), b = rastgele(10, 999); const sonuc = a + b; const soru = `${a} + ${b}`; const ust = 'Toplam tek mi, çift mi?';
        return {
            soru, ust, dogru: sonuc % 2 === 0 ? 'cift' : 'tek',
            secenekler: [
                { deger: 'tek', yazi: 'Tek', renk: '#9333ea' },
                { deger: 'cift', yazi: 'Çift', renk: '#0891b2' },
            ],
        };
    }),
});
</script>
</body>
</html>
