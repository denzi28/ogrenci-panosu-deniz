<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Öğretmen hesabı aç · Sınıf Panosu</title>
    <meta name="theme-color" content="#f7f4ee">
    <link rel="icon" type="image/png" href="assets/icon-192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/tema-renkli.css">
    <script src="js/tema.js"></script>
</head>
<body class="login-body">
    <main class="login-container" style="max-width:460px">
        <div class="giris-kart">
            <div class="giris-ust">
                <div class="marka-rozet"><i class="fas fa-chalkboard-user"></i></div>
                <h1>Öğretmen hesabı aç</h1>
                <p>Kendi sınıfınız için hesap açın. Bunun için size verilen davet kodu gerekir</p>
            </div>

            <form id="kayit-form" novalidate autocomplete="off">
                <div class="form-group">
                    <label for="davet">Davet kodu</label>
                    <input type="text" id="davet" required autocapitalize="characters" spellcheck="false" placeholder="KUS-4821" style="text-transform:uppercase;letter-spacing:1px">
                </div>
                <div class="form-group">
                    <label for="ad">Adınız soyadınız</label>
                    <input type="text" id="ad" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="sinif">Sınıfınız / şubeniz</label>
                    <input type="text" id="sinif" required placeholder="4/A" maxlength="30">
                    <small class="alan-not" id="sinif-not"></small>
                </div>
                <div class="form-group">
                    <label for="kullanici">Kullanıcı adı <small style="font-weight:400;color:var(--muted)">girişte bunu yazacaksınız</small></label>
                    <input type="text" id="kullanici" required autocomplete="username" autocapitalize="none" spellcheck="false">
                </div>
                <div class="form-group">
                    <label for="sifre">Şifre <small style="font-weight:400;color:var(--muted)">en az 6 karakter</small></label>
                    <div class="sifre-alan">
                        <input type="password" id="sifre" required autocomplete="new-password" minlength="6">
                        <button type="button" class="sifre-goster" id="sifre-goster" aria-label="Şifreyi göster"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <div id="hata" class="error" role="alert"></div>
                <button type="submit" id="kayit-btn" class="btn btn-primary btn-buyuk w-100">Hesabı aç ve sınıfı kur</button>
            </form>
            <p class="giris-ipucu">Davet kodunuz yoksa sitenin yöneticisinden isteyin. Her kod bir kez kullanılabilir</p>
        </div>
        <div class="giris-alt">
            <a href="login.html"><i class="fas fa-arrow-left"></i> Girişe dön</a>
        </div>
    </main>

    <script type="module">
        import { ogretmenKaydi, kullanilabilirSinifId } from './js/kayit.js';
        import { sinifKisaltmasi } from './js/sinif.js';

        const $ = (id) => document.getElementById(id);
        const hata = $('hata'), btn = $('kayit-btn');

        $('sifre-goster').addEventListener('click', (e) => {
            const goster = $('sifre').type === 'password';
            $('sifre').type = goster ? 'text' : 'password';
            e.currentTarget.innerHTML = `<i class="fas fa-eye${goster ? '-slash' : ''}"></i>`;
        });
        // Velilere verilecek linkin kısaltmasını önceden göster
        let zaman;
        $('sinif').addEventListener('input', () => {
            clearTimeout(zaman);
            const ad = $('sinif').value.trim();
            if (!ad) { $('sinif-not').textContent = ''; return; }
            zaman = setTimeout(async () => {
                const id = await kullanilabilirSinifId(ad).catch(() => sinifKisaltmasi(ad));
                $('sinif-not').textContent = `Velilere verilecek link: …/?sinif=${id}`;
            }, 350);
        });

        $('kayit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const v = {
                davet: $('davet').value.trim().toUpperCase(),
                ad: $('ad').value.trim(),
                sinifAdi: $('sinif').value.trim(),
                kullaniciAdi: $('kullanici').value.trim(),
                sifre: $('sifre').value,
            };
            if (!v.davet || !v.ad || !v.sinifAdi || !v.kullaniciAdi || !v.sifre) { hata.textContent = 'Bütün alanları doldurun'; return; }
            if (/\s/.test(v.kullaniciAdi)) { hata.textContent = 'Kullanıcı adında boşluk olmasın'; return; }
            if (v.sifre.length < 6) { hata.textContent = 'Şifre en az 6 karakter olsun'; return; }
            hata.textContent = '';
            btn.disabled = true; btn.textContent = 'Hesap açılıyor';
            try {
                await ogretmenKaydi(v);
                location.replace('kurulum.html');
            } catch (err) {
                hata.textContent = err.message || 'Hesap açılamadı, tekrar deneyin';
                btn.disabled = false; btn.textContent = 'Hesabı aç ve sınıfı kur';
            }
        });
    </script>
</body>
</html>
