<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tek mi, çift mi?</title>
<link rel="stylesheet" href="motor/oyun.css">
</head>
<body>
<script type="module">
import { secmeli, rastgele } from './motor/oyun.js';

secmeli({
    baslik: 'Tek mi, çift mi?', maskot: '🐞', renk: '#9333ea',
    nasil: 'Sayının son basamağına bak: 0, 2, 4, 6, 8 ise çift, 1, 3, 5, 7, 9 ise tek',
    hedefYazi: '10 soru · geçmek için en az 60 puan',
    soruSayisi: 10, limit: 100, dogruPuan: 10, baraj: 60, duzen: 'iki',
    sorular: () => Array.from({ length: 10 }, () => {
        const sonuc = rastgele(10, 999); const soru = String(sonuc); const ust = 'Bu sayı tek mi, çift mi?';
        return {
            soru, ust, dogru: sonuc % 2 === 0 ? 'cift' : 'tek',
            secenekler: [
                { deger: 'tek', yazi: 'Tek', renk: '#9333ea' },
                { deger: 'cift', yazi: 'Çift', renk: '#0891b2' },
            ],
        };
    }),
});
</script>
</body>
</html>
