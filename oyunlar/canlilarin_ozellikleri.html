<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canlıların Ortak Özellikleri</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #f3e8ff);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #334155;
        }

        #header {
            background: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .header-bilgi {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .hedef-kutusu, .soru-kutusu {
            font-size: 1.1rem;
            font-weight: 700;
            color: #64748b;
            background: #f8fafc;
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px dashed #cbd5e1;
        }

        .soru-kutusu {
            background: #eff6ff;
            color: #2563eb;
            border-color: #bfdbfe;
        }

        .skor-kutusu {
            background: #f0fdf4;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #16a34a;
            border: 2px solid #bbf7d0;
            transition: all 0.3s;
        }

        #game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        #soru-karti {
            background: white; 
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            width: 100%;
            margin-bottom: 25px;
            border: 4px solid #cbd5e1;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #soru-metni {
            font-size: 1.6rem; 
            font-weight: 700;
            line-height: 1.4;
            color: #1e293b;
        }

        .soru-ikoni {
            font-size: 4rem;
            margin-bottom: -10px;
        }

        /* 7 Buton için Grid Yapısı */
        .buton-izgarasi {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 600px;
        }

        .tam-genislik {
            grid-column: span 2;
        }

        .secenek-btn {
            padding: 15px 10px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: white;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .secenek-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2);
        }

        /* Renk Kodları */
        .btn-buyume { background: #10b981; }
        .btn-bosaltim { background: #0ea5e9; }
        .btn-beslenme { background: #f59e0b; }
        .btn-solunum { background: #8b5cf6; }
        .btn-tepki { background: #ef4444; }
        .btn-hareket { background: #f97316; }
        .btn-ureme { background: #ec4899; }

        .dogru-animasyon {
            background: #d1fae5 !important;
            border-color: #10b981 !important;
            transform: scale(1.05);
        }

        .yanlis-animasyon {
            animation: salla 0.4s;
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
        }

        @keyframes salla {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        #bitis-ekrani {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .bitis-baslik {
            font-size: 2.5rem;
            color: #10b981;
            margin-bottom: 10px;
        }

        .bitis-puan {
            font-size: 5rem;
            font-weight: 900;
            color: #2563eb;
            margin: 15px 0;
            text-shadow: 2px 2px 0 #bfdbfe;
        }
        
        @media (max-width: 600px) {
            #header { flex-direction: column; gap: 10px; }
            #soru-metni { font-size: 1.3rem; }
            .secenek-btn { font-size: 1rem; padding: 12px 5px; }
            .soru-ikoni { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div id="header">
        <div class="header-bilgi">
            <div class="soru-kutusu">Soru: <span id="soru-sayaci">1/10</span></div>
            <div class="hedef-kutusu">Maksimum: 100 Puan 🏆</div>
        </div>
        <div class="skor-kutusu" id="skor-kutusu">Puan: <span id="puan-alani">0</span></div>
    </div>

    <div id="game-area">
        <div id="soru-karti">
            <div class="soru-ikoni" id="soru-ikoni">❓</div>
            <div id="soru-metni">Soru Yükleniyor...</div>
        </div>

        <div class="buton-izgarasi" id="buton-grubu">
            <button class="secenek-btn btn-buyume" onclick="cevapKontrol('Büyüme')">🌱 Büyüme</button>
            <button class="secenek-btn btn-bosaltim" onclick="cevapKontrol('Boşaltım')">💧 Boşaltım</button>
            <button class="secenek-btn btn-beslenme" onclick="cevapKontrol('Beslenme')">🍎 Beslenme</button>
            <button class="secenek-btn btn-solunum" onclick="cevapKontrol('Solunum')">💨 Solunum</button>
            <button class="secenek-btn btn-tepki" onclick="cevapKontrol('Tepki Verme')">⚡ Tepki Verme</button>
            <button class="secenek-btn btn-hareket" onclick="cevapKontrol('Hareket Etme')">🏃‍♂️ Hareket Etme</button>
            <button class="secenek-btn btn-ureme tam-genislik" onclick="cevapKontrol('Üreme')">🐣 Üreme</button>
        </div>

        <div id="bitis-ekrani">
            <div class="bitis-baslik">🎉 Görev Tamamlandı! 🎉</div>
            <div style="font-size: 1.3rem; color: #475569;">Toplam Kazandığın Puan:</div>
            <div class="bitis-puan" id="sonuc-puani">100</div>
            <div style="font-size: 1.2rem; color: #16a34a; font-weight: bold; padding: 15px; background: #dcfce7; border-radius: 12px;">
                ✅ Sonuçlar öğretmenine gönderiliyor...
            </div>
        </div>
    </div>

    <script>
        // 🌟 Pedagojik olarak tamamen ayrıştırılmış ve kafa karıştırmayan 14 yeni soru
        let tumSorular = [
            { metin: "Tavukların yumurtlayarak yeni civcivler dünyaya getirmesi.", cevap: "Üreme", ikon: "🐔" },
            { metin: "İnsanların spor yaparken terleyerek vücutlarındaki fazla suyu atması.", cevap: "Boşaltım", ikon: "💦" },
            { metin: "Kaplumbağaların tehlike anında başını kabuğunun içine çekerek saklanması.", cevap: "Tepki Verme", ikon: "🐢" },
            { metin: "Balıkların solungaçları ile sudan oksijen alarak yaşamaya devam etmesi.", cevap: "Solunum", ikon: "🐟" },
            { metin: "Kuşların gökyüzünde kanat çırparak bir yerden bir yere uçması.", cevap: "Hareket Etme", ikon: "🦅" },
            { metin: "İneklerin çayırlarda karınlarını doyurmak için taze ot yemesi.", cevap: "Beslenme", ikon: "🐄" },
            { metin: "Küçük bir fidanın zamanla büyüyerek kocaman bir ağaç olması.", cevap: "Büyüme", ikon: "🌳" },
            { metin: "Kedilerin sevimli yavrular doğurarak çoğalması.", cevap: "Üreme", ikon: "🐈" },
            { metin: "Vücudumuzdaki zararlı atıkların idrar veya ter yoluyla dışarı atılması.", cevap: "Boşaltım", ikon: "💧" },
            { metin: "Sıcak bir çaydanlığa dokununca elimizi hızla geri çekmemiz.", cevap: "Tepki Verme", ikon: "☕" },
            { metin: "İnsanların akciğerlerine hava çekip sürekli nefes alıp vermesi.", cevap: "Solunum", ikon: "🫁" },
            { metin: "Bir çitanın ormanda bir yerden başka bir yere çok hızlı koşması.", cevap: "Hareket Etme", ikon: "🐆" },
            { metin: "Tırtılların kelebek olabilmek için sürekli yaprak yemesi.", cevap: "Beslenme", ikon: "🐛" },
            { metin: "Yeni doğan bir bebeğin yıllar geçtikçe büyüyüp yetişkin bir insan olması.", cevap: "Büyüme", ikon: "👶" }
        ];

        // Soruları karıştır ve İÇİNDEN SADECE 10 TANESİNİ AL
        tumSorular.sort(() => Math.random() - 0.5);
        const aktifSorular = tumSorular.slice(0, 10);

        let gecerliSoruIndex = 0;
        let puan = 0;
        let beklemede = false;
        
        const soruKarti = document.getElementById('soru-karti');
        const soruMetni = document.getElementById('soru-metni');
        const soruIkoni = document.getElementById('soru-ikoni');
        const puanAlani = document.getElementById('puan-alani');
        const soruSayaci = document.getElementById('soru-sayaci');

        let audioCtx = null;

        function sesCal(frekans, tip, sure) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = tip;
                osc.frequency.setValueAtTime(frekans, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + sure);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + sure);
            } catch (error) { }
        }

        function dogruSesi() { sesCal(600, 'sine', 0.1); setTimeout(() => sesCal(800, 'sine', 0.15), 100); }
        function yanlisSesi() { sesCal(300, 'sawtooth', 0.3); }

        function soruyuGoster() {
            if (gecerliSoruIndex >= aktifSorular.length) {
                oyunuBitir();
                return;
            }

            soruSayaci.innerText = (gecerliSoruIndex + 1) + "/10";
            
            const soru = aktifSorular[gecerliSoruIndex];
            soruMetni.innerText = soru.metin;
            soruIkoni.innerText = soru.ikon;
            
            soruKarti.style.transform = 'scale(0.8)';
            soruKarti.style.opacity = '0';
            setTimeout(() => {
                soruKarti.style.transform = 'scale(1)';
                soruKarti.style.opacity = '1';
                beklemede = false;
            }, 150);
        }

        function cevapKontrol(secilenCevap) {
            if (beklemede) return;
            beklemede = true;

            const dogruCevap = aktifSorular[gecerliSoruIndex].cevap;

            if (secilenCevap === dogruCevap) {
                // DOĞRU BİLDİ (+10 Puan)
                dogruSesi();
                puan += 10;
                puanAlani.innerText = puan;
                soruKarti.classList.add('dogru-animasyon');
            } else {
                // YANLIŞ BİLDİ (Puan düşmüyor ama animasyon oynuyor)
                yanlisSesi();
                soruKarti.classList.add('yanlis-animasyon');
            }

            // Yanlış da bilse doğru da bilse sıradaki soruya geç
            setTimeout(() => {
                soruKarti.classList.remove('dogru-animasyon', 'yanlis-animasyon');
                gecerliSoruIndex++;
                soruyuGoster();
            }, 800);
        }

        function oyunuBitir() {
            document.getElementById('header').style.display = 'none';
            soruKarti.style.display = 'none';
            document.getElementById('buton-grubu').style.display = 'none';
            
            const bitisEkrani = document.getElementById('bitis-ekrani');
            bitisEkrani.style.display = 'flex';
            document.getElementById('sonuc-puani').innerText = puan;

            // Öğretmene kazanılan puanı doğrudan gönderir (Maksimum 100)
            if (window.parent) {
                window.parent.postMessage({ 
                    islem: 'gorev_bitti', 
                    puan: puan, 
                    limit: 100 
                }, '*');
            }
        }

        // Ses engelini aşmak için ilk dokunuşta başlatıcı
        document.body.addEventListener('click', function initAudio() {
            if(audioCtx === null) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if(audioCtx.state === 'suspended') audioCtx.resume();
            document.body.removeEventListener('click', initAudio);
        }, { once: true });
        
        // Sayfayı beklemeden anında ilk soruyu çağırıyoruz
        soruyuGoster();

    </script>
</body>
</html>
