<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eş Anlamlı Kelimeler Oyunu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #fef3c7, #e0f2fe);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #334155;
        }

        #header {
            background: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .header-bilgi {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .hedef-kutusu, .soru-kutusu {
            font-size: 1.1rem;
            font-weight: 700;
            color: #64748b;
            background: #f8fafc;
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px dashed #cbd5e1;
        }

        .soru-kutusu {
            background: #eff6ff;
            color: #2563eb;
            border-color: #bfdbfe;
        }

        .skor-kutusu {
            background: #f0fdf4;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #16a34a;
            border: 2px solid #bbf7d0;
            transition: all 0.3s;
        }

        #game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        #soru-karti {
            background: white; 
            padding: 35px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            width: 100%;
            margin-bottom: 25px;
            border: 4px solid #cbd5e1;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #soru-metni {
            font-size: 2.2rem; 
            font-weight: 700;
            line-height: 1.4;
            color: #1e293b;
        }

        .buton-izgarasi {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 600px;
        }

        .secenek-btn {
            padding: 18px 10px;
            font-size: 1.3rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: white;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            background: #3b82f6;
        }

        .secenek-btn:nth-child(2) { background: #10b981; }
        .secenek-btn:nth-child(3) { background: #f59e0b; }
        .secenek-btn:nth-child(4) { background: #8b5cf6; }

        .secenek-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2);
        }

        .dogru-animasyon {
            background: #d1fae5 !important;
            border-color: #10b981 !important;
            transform: scale(1.05);
        }

        .yanlis-animasyon {
            animation: salla 0.4s;
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
        }

        @keyframes salla {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        #bitis-ekrani {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .bitis-baslik {
            font-size: 2.5rem;
            color: #10b981;
            margin-bottom: 10px;
        }

        .bitis-puan {
            font-size: 5rem;
            font-weight: 900;
            color: #2563eb;
            margin: 15px 0;
            text-shadow: 2px 2px 0 #bfdbfe;
        }
        
        @media (max-width: 600px) {
            #header { flex-direction: column; gap: 10px; }
            #soru-metni { font-size: 1.6rem; }
            .secenek-btn { font-size: 1.1rem; padding: 15px 5px; }
            .buton-izgarasi { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="header">
        <div class="header-bilgi">
            <div class="soru-kutusu">Soru: <span id="soru-sayaci">1/10</span></div>
            <div class="hedef-kutusu">Maksimum: 100 Puan</div>
        </div>
        <div class="skor-kutusu" id="skor-kutusu">Puan: <span id="puan-alani">0</span></div>
    </div>

    <div id="game-area">
        <div id="soru-karti">
            <div style="font-size: 1.1rem; color: #64748b; font-weight: 600;">Aşağıdaki kelimenin eş anlamlısı hangisidir?</div>
            <div id="soru-metni">Kelime Yükleniyor...</div>
        </div>

        <div class="buton-izgarasi" id="buton-grubu">
            <button class="secenek-btn" onclick="cevapKontrol(0)" id="secenek-0">Seçenek 1</button>
            <button class="secenek-btn" onclick="cevapKontrol(1)" id="secenek-1">Seçenek 2</button>
            <button class="secenek-btn" onclick="cevapKontrol(2)" id="secenek-2">Seçenek 3</button>
            <button class="secenek-btn" onclick="cevapKontrol(3)" id="secenek-3">Seçenek 4</button>
        </div>

        <div id="bitis-ekrani">
            <div class="bitis-baslik">Harika İş Çıkardın!</div>
            <div style="font-size: 1.3rem; color: #475569;">Toplam Kazandığın Puan:</div>
            <div class="bitis-puan" id="sonuc-puani">100</div>
            <div style="font-size: 1.2rem; color: #16a34a; font-weight: bold; padding: 15px; background: #dcfce7; border-radius: 12px;">
                Sonuçlar öğretmenine gönderiliyor...
            </div>
        </div>
    </div>

    <script>
        // PDF ve ders notlarındaki eş anlamlı kelime çiftleri
        let tumKelimeler = [
            { kelime: "Doktor", esAnlamli: "Hekim" },
            { kelime: "Hediye", esAnlamli: "Armağan" },
            { kelime: "Konut", esAnlamli: "Ev" },
            { kelime: "İhtiyar", esAnlamli: "Yaşlı" },
            { kelime: "Kırmızı", esAnlamli: "Al" },
            { kelime: "Okul", esAnlamli: "Mektep" },
            { kelime: "Misafir", esAnlamli: "Konuk" },
            { kelime: "Doğa", esAnlamli: "Tabiat" },
            { kelime: "Fakir", esAnlamli: "Yoksul" },
            { kelime: "Hatıra", esAnlamli: "Anı" },
            { kelime: "Özlem", esAnlamli: "Hasret" },
            { kelime: "Büyük", esAnlamli: "İri" },
            { kelime: "Kelime", esAnlamli: "Sözcük" },
            { kelime: "Sene", esAnlamli: "Yıl" },
            { kelime: "Hızlı", esAnlamli: "Çabuk" },
            { kelime: "Uyarı", esAnlamli: "İkaz" },
            { kelime: "Sonbahar", esAnlamli: "Güz" },
            { kelime: "Fayda", esAnlamli: "Yarar" },
            { kelime: "Öğrenci", esAnlamli: "Talebe" },
            { kelime: "Cümle", esAnlamli: "Tümce" },
            { kelime: "Islak", esAnlamli: "Yaş" },
            { kelime: "Siyah", esAnlamli: "Kara" },
            { kelime: "Surat", esAnlamli: "Yüz" },
            { kelime: "Öykü", esAnlamli: "Hikâye" },
            { kelime: "Kafa", esAnlamli: "Baş" },
            { kelime: "Mekân", esAnlamli: "Yer" }
        ];

        let tumCevaplar = tumKelimeler.map(k => k.esAnlamli);

        tumKelimeler.sort(() => Math.random() - 0.5);
        const aktifSorular = tumKelimeler.slice(0, 10);

        let gecerliSoruIndex = 0;
        let puan = 0;
        let beklemede = false;
        let dogruSecenekIndex = 0;
        
        const soruKarti = document.getElementById('soru-karti');
        const soruMetni = document.getElementById('soru-metni');
        const puanAlani = document.getElementById('puan-alani');
        const soruSayaci = document.getElementById('soru-sayaci');

        let audioCtx = null;

        function sesCal(frekans, tip, sure) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = tip;
                osc.frequency.setValueAtTime(frekans, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + sure);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + sure);
            } catch (error) { }
        }

        function dogruSesi() { sesCal(600, 'sine', 0.1); setTimeout(() => sesCal(800, 'sine', 0.15), 100); }
        function yanlisSesi() { sesCal(300, 'sawtooth', 0.3); }

        function soruyuGoster() {
            if (gecerliSoruIndex >= aktifSorular.length) {
                oyunuBitir();
                return;
            }

            soruSayaci.innerText = (gecerliSoruIndex + 1) + "/10";
            
            const soru = aktifSorular[gecerliSoruIndex];
            soruMetni.innerText = soru.kelime;

            let secenekler = [soru.esAnlamli];
            while (secenekler.length < 4) {
                let rastgeleKelime = tumCevaplar[Math.floor(Math.random() * tumCevaplar.length)];
                if (!secenekler.includes(rastgeleKelime)) {
                    secenekler.push(rastgeleKelime);
                }
            }
            secenekler.sort(() => Math.random() - 0.5);
            dogruSecenekIndex = secenekler.indexOf(soru.esAnlamli);

            for (let i = 0; i < 4; i++) {
                document.getElementById(`secenek-${i}`).innerText = secenekler[i];
            }
            
            soruKarti.style.transform = 'scale(0.8)';
            soruKarti.style.opacity = '0';
            setTimeout(() => {
                soruKarti.style.transform = 'scale(1)';
                soruKarti.style.opacity = '1';
                beklemede = false;
            }, 150);
        }

        function cevapKontrol(secilenIndex) {
            if (beklemede) return;
            beklemede = true;

            const secilenBtn = document.getElementById(`secenek-${secilenIndex}`);

            if (secilenIndex === dogruSecenekIndex) {
                dogruSesi();
                puan += 10;
                puanAlani.innerText = puan;
                soruKarti.classList.add('dogru-animasyon');
                secilenBtn.style.background = '#10b981';
            } else {
                yanlisSesi();
                soruKarti.classList.add('yanlis-animasyon');
                secilenBtn.style.background = '#ef4444';
                document.getElementById(`secenek-${dogruSecenekIndex}`).style.background = '#10b981';
            }

            setTimeout(() => {
                soruKarti.classList.remove('dogru-animasyon', 'yanlis-animasyon');
                for (let i = 0; i < 4; i++) {
                    document.getElementById(`secenek-${i}`).style.background = '';
                }
                gecerliSoruIndex++;
                soruyuGoster();
            }, 1000);
        }

        function oyunuBitir() {
            document.getElementById('header').style.display = 'none';
            soruKarti.style.display = 'none';
            document.getElementById('buton-grubu').style.display = 'none';
            
            const bitisEkrani = document.getElementById('bitis-ekrani');
            bitisEkrani.style.display = 'flex';
            document.getElementById('sonuc-puani').innerText = puan;

            if (window.parent) {
                window.parent.postMessage({ 
                    islem: 'gorev_bitti', 
                    puan: puan, 
                    limit: 100 
                }, '*');
            }
        }

        document.body.addEventListener('click', function initAudio() {
            if(audioCtx === null) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if(audioCtx.state === 'suspended') audioCtx.resume();
            document.body.removeEventListener('click', initAudio);
        }, { once: true });
        
        soruyuGoster();
    </script>
</body>
</html>
