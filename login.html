<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Giriş · Sınıf Panosu</title>
    <meta name="theme-color" content="#f7f4ee">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="3/D Panosu">
    <link rel="apple-touch-icon" href="assets/icon.png">
    <link rel="icon" type="image/png" href="assets/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/tema-renkli.css">
    <script src="js/tema.js"></script>
</head>
<body class="login-body">
    <main class="login-container">
        <div class="giris-kart">
            <div class="giris-ust">
                <div class="marka-rozet"><i class="fas fa-chalkboard"></i></div>
                <h1>Sınıf panosuna giriş</h1>
                <p>Öğrenci ya da öğretmen hesabınla gir</p>
            </div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Kullanıcı adı</label>
                    <input type="text" id="username" required autocomplete="username" autocapitalize="none" spellcheck="false">
                </div>
                <div class="form-group">
                    <label for="password">Şifre</label>
                    <div class="sifre-alan">
                        <input type="password" id="password" required autocomplete="current-password">
                        <button type="button" class="sifre-goster" id="sifre-goster" aria-label="Şifreyi göster"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <div id="error-message" class="error" role="alert"></div>
                <button type="submit" id="giris-btn" class="btn btn-primary btn-buyuk w-100">Giriş yap</button>
            </form>

            <p class="giris-ipucu">Öğrenci hesaplarını öğretmen açar. Kullanıcı adın ve şifren giriş kartında yazar; unuttuysan öğretmenine sor</p>
            <p class="giris-ipucu giris-ogretmen">Öğretmen misiniz? <a href="kayit.html">Davet koduyla öğretmen hesabı açın</a></p>
        </div>
        <div class="giris-alt">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Sınıf panosuna dön</a>
        </div>
    </main>

    <script type="module">
        import { auth } from './js/auth.js';

        const form = document.getElementById('login-form');
        const hata = document.getElementById('error-message');
        const btn = document.getElementById('giris-btn');
        const sifre = document.getElementById('password');

        document.getElementById('sifre-goster').addEventListener('click', (e) => {
            const goster = sifre.type === 'password';
            sifre.type = goster ? 'text' : 'password';
            e.currentTarget.innerHTML = `<i class="fas fa-eye${goster ? '-slash' : ''}"></i>`;
            e.currentTarget.setAttribute('aria-label', goster ? 'Şifreyi gizle' : 'Şifreyi göster');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const kullanici = document.getElementById('username').value.trim();
            const parola = sifre.value;
            if (!kullanici || !parola) { hata.textContent = 'Kullanıcı adını ve şifreni yaz'; return; }

            hata.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Giriş yapılıyor';

            const basarili = await auth.login(kullanici, parola);
            if (!basarili) {
                hata.textContent = navigator.onLine ? 'Kullanıcı adı ya da şifre hatalı' : 'İnternet bağlantısı yok';
                btn.disabled = false;
                btn.textContent = 'Giriş yap';
                sifre.select();
            }
        });
    </script>
</body>
</html>
