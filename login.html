<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sisteme Giriş</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body class="login-body">
    <div class="login-container card">
        <h2 style="text-align: center; margin-bottom: 20px;">Kullanıcı Girişi</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" id="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="password" required>
            </div>
            <div id="error-message" class="error"></div>
            <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
        </form>
        <div style="margin-top: 15px; text-align: center;">
            <a href="index.html">← Misafir Panosuna Dön</a>
        </div>
    </div>

<script type="module">
        import { auth } from './js/auth.js';

        // Fonksiyonun başına "async" ekledik
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            // "await" ekledik, çünkü Firebase'den yanıt gelmesini bekleyeceğiz
            const success = await auth.login(user, pass); 
            if (!success) {
                document.getElementById('error-message').innerText = "Hatalı kullanıcı adı veya şifre!";
            }
        });
    </script>
</body>
</html>
