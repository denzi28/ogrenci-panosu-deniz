<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eş sesli kelimeler</title>
<link rel="stylesheet" href="motor/oyun.css">
</head>
<body>
<script type="module">
import { secmeli, karistir } from './motor/oyun.js';

// Cümleler, içindeki eş sesli (sesteş) kelime ve şıklar (öğretmenin listesi)
const SORULAR = [
        { cumle: "Ben ocak ayında doğdum.", dogru: "ocak", secenekler: ["ben", "ocak", "ayında", "doğdum"] },
        { cumle: "Ocağın üstünde çay kaynıyordu.", dogru: "çay", secenekler: ["ocağın", "üstünde", "çay", "kaynıyordu"] },
        { cumle: "Bir çay kenarında oturup sohbet ettik.", dogru: "çay", secenekler: ["bir", "çay", "kenarında", "sohbet"] },
        { cumle: "Havuzda başını çıkarmadan uzun süre yüzdü.", dogru: "yüzdü", secenekler: ["havuzda", "uzun", "süre", "yüzdü"] },
        { cumle: "Bu montu bin liraya aldım.", dogru: "bin", secenekler: ["bu", "montu", "bin", "liraya"] },
        { cumle: "Sabah yürüyüşünde bin metre yürüdüm.", dogru: "bin", secenekler: ["sabah", "bin", "metre", "yürüdüm"] },
        { cumle: "Hafta sonu üzüm bağlarını gezdik.", dogru: "bağlarını", secenekler: ["hafta", "üzüm", "bağlarını", "gezdik"] },
        { cumle: "Ayakkabısının bağını sıkıca bağladı.", dogru: "bağını", secenekler: ["ayakkabısının", "bağını", "sıkıca", "bağladı"] },
        { cumle: "Gökyüzünü kara bulutlar sardı.", dogru: "kara", secenekler: ["gökyüzünü", "kara", "bulutlar", "sardı"] },
        { cumle: "Bahçedeki kırmızı gül çok güzel kokuyordu.", dogru: "gül", secenekler: ["bahçedeki", "kırmızı", "gül", "kokuyordu"] },
        { cumle: "Fırından taze sıcak ekmek aldık.", dogru: "ekmek", secenekler: ["fırından", "taze", "ekmek", "aldık"] }
];

secmeli({
    baslik: 'Eş sesli kelimeler', maskot: '🐙', renk: '#0891b2',
    nasil: 'Cümledeki eş sesli (sesteş) kelimeyi bul. Yazılışı aynı, anlamı farklı olan kelimeler',
    hedefYazi: '10 soru · her doğru 10 puan',
    soruSayisi: 10, limit: 100, dogruPuan: 10, soruBoyu: 'metin',
    sorular: () => karistir(SORULAR).slice(0, 10).map(s => ({
        ust: 'Sesteş kelime hangisi?', soru: s.cumle, secenekler: karistir(s.secenekler), dogru: s.dogru,
    })),
});
</script>
</body>
</html>
