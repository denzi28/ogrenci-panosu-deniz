<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3/D Sınıfı Panosu</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <header class="top-header">
        <div class="header-left">
            <button id="mobile-menu-btn" class="hamburger-btn">☰</button>
            <h1>Sınıf Panosu</h1>
        </div>
        <!-- Butona bir ID (auth-btn) verdik ki JavaScript ile kontrol edebilelim -->
        <a href="login.html" id="auth-btn" class="btn btn-primary">Sisteme Giriş Yap</a>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <nav id="menu-container"></nav>
        </aside>
        <main id="app-content" class="content-area">
            <div class="card">
                <h2>Sınıfımıza Hoş Geldiniz!</h2>
                <p>Soldaki menüden herkese açık duyuru ve etkinlikleri inceleyebilirsiniz.</p>
            </div>
        </main>
    </div>

    <script type="module">
        import { initApp } from './js/app.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            const kayitliKullanici = localStorage.getItem('currentUser');
            let baslangicRolu = 'guest'; // Varsayılan olarak herkesi misafir kabul et

            if (kayitliKullanici) {
                try {
                    const user = JSON.parse(kayitliKullanici);
                    baslangicRolu = user.role; // Hafızada kullanıcı varsa onun rolünü (teacher/student) al
                    
                    // Giriş yapılmışsa sağ üstteki butonu "Çıkış Yap" olarak değiştir
                    const authBtn = document.getElementById('auth-btn');
                    if (authBtn) {
                        authBtn.innerText = 'Çıkış Yap';
                        authBtn.href = '#';
                        authBtn.style.backgroundColor = '#ef4444'; // Kırmızı renk yap
                        authBtn.style.boxShadow = '0 4px 0 #b91c1c';
                        
                        // Çıkış yap butonuna tıklanınca hafızayı temizle ve sayfayı yenile
                        authBtn.addEventListener('click', (e) => {
                            e.preventDefault();
                            localStorage.removeItem('currentUser');
                            localStorage.removeItem('sonGirisTarihi');
                            window.location.reload(); 
                        });
                    }
                } catch(e) {
                    console.error('Kullanıcı verisi okunamadı');
                }
            }

            // Kapıdaki güvenlik kontrolü bittikten sonra uygulamayı doğru rolle başlat
            initApp(baslangicRolu);
        });
    </script>
</body>
</html>
