<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bilimsel Bilgiye Ulaşma Yolları</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f5f3ff;
            --text: #1e1b4b;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            position: relative;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.15);
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .logout-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #6d28d9;
            transition: 0.1s;
        }

        .logout-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #6d28d9;
        }

        .question-card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            font-size: 1.4rem;
            line-height: 1.5;
            color: var(--text);
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 2px solid #c4b5fd;
            padding: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            color: var(--primary);
            transition: all 0.2s;
            box-shadow: 0 4px 0 #c4b5fd;
        }

        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #c4b5fd;
        }

        .option-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
            box-shadow: 0 4px 0 #047857;
        }

        .option-btn.wrong {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
            box-shadow: 0 4px 0 #b91c1c;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake { animation: shake 0.4s ease-in-out; }
        
        #feedback {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.5rem;
            color: white;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        #canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 99;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            .question-card { font-size: 1.2rem; padding: 20px; }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div id="feedback"></div>

    <div id="game-container">
        <div class="stats-bar">
            <div>🏆 Puan: <span id="score">0</span> / 60</div>
            <button class="logout-btn" onclick="kaydetVeCik()">Kaydet ve Çık</button>
        </div>

        <div class="question-card" id="question-box">
            Soru yükleniyor...
        </div>

        <div class="options-grid" id="options-box">
            <!-- Butonlar JavaScript ile eklenecek -->
        </div>
    </div>

    <script>
        const HEDEF_PUAN = 60;
        let score = 0;
        let currentQuestionIndex = 0;
        let canAnswer = true;

        const questions = [
            {
                q: "Gökyüzüne baktın, gri bulutları gördün ve rüzgârın estiğini fark ettin. 'Yağmur yağabilir.' diye düşünmen hangi bilimsel yöntemdir?",
                options: ["Tahmin Etme", "Deney Yapma", "Belge Taraması", "Model Oluşturma"],
                answer: "Tahmin Etme"
            },
            {
                q: "Okul bahçesindeki karıncaların yuvalarına yiyecek taşıdığını üç gün boyunca dikkatlice takip edip inceledin. Bu yöntem hangisidir?",
                options: ["Gözlem Yapma", "İletişim Kurma", "Tahmin Etme", "Model Oluşturma"],
                answer: "Gözlem Yapma"
            },
            {
                q: "Güneş, Dünya ve Ay'ın büyüklüklerini karşılaştırmak için oyun hamuruyla onların bir benzerini yaptın. Bu yöntem hangisidir?",
                options: ["Model Oluşturma", "Deney Yapma", "Gözlem Yapma", "Belge Taraması"],
                answer: "Model Oluşturma"
            },
            {
                q: "Büyüklerinin çocukluğunda neler yaptıklarını öğrenmek için onların eski günlüklerini ve okul fotoğraflarını inceledin. Bu yöntem hangisidir?",
                options: ["Belge Taraması", "Model Oluşturma", "Tahmin Etme", "Deney Yapma"],
                answer: "Belge Taraması"
            },
            {
                q: "Dondurmanın erime hızının farklı ortamlarda değişip değişmeyeceğini görmek için buzluktan çıkardığın dondurmayı test ettin. Bu yöntem hangisidir?",
                options: ["Deney Yapma", "İletişim Kurma", "Belge Taraması", "Model Oluşturma"],
                answer: "Deney Yapma"
            },
            {
                q: "Dengeli ve sağlıklı beslenme hakkında doğru bilgi almak için bir doktora veya sağlık çalışanına sorular sordun. Bu yöntem hangisidir?",
                options: ["İletişim Kurma", "Gözlem Yapma", "Tahmin Etme", "Deney Yapma"],
                answer: "İletişim Kurma"
            }
        ];

        questions.sort(() => Math.random() - 0.5);

        const scoreEl = document.getElementById('score');
        const questionBox = document.getElementById('question-box');
        const optionsBox = document.getElementById('options-box');
        const feedbackEl = document.getElementById('feedback');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function loadQuestion() {
            canAnswer = true;
            if (currentQuestionIndex >= questions.length) {
                currentQuestionIndex = 0; 
                questions.sort(() => Math.random() - 0.5);
            }

            const qData = questions[currentQuestionIndex];
            questionBox.innerText = qData.q;
            questionBox.classList.remove('shake');
            
            const shuffledOptions = [...qData.options].sort(() => Math.random() - 0.5);
            
            optionsBox.innerHTML = '';
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, qData.answer);
                optionsBox.appendChild(btn);
            });
        }

        function showFeedback(text, color) {
            feedbackEl.innerHTML = text;
            feedbackEl.style.backgroundColor = color;
            feedbackEl.style.display = 'block';
            setTimeout(() => { feedbackEl.style.display = 'none'; }, 1500);
        }

        function checkAnswer(btn, selected, correct) {
            if (!canAnswer) return;
            canAnswer = false;

            if (selected === correct) {
                btn.classList.add('correct');
                score += 10;
                scoreEl.innerText = score;

                if (score >= HEDEF_PUAN) {
                    // Hedef puana ulaşıldıysa GÖREV BİTTİ mesajı gönder ve pencereyi kapat
                    window.parent.postMessage({ islem: 'gorev_bitti', puan: score, limit: HEDEF_PUAN }, '*');
                    
                    showFeedback("GÖREV TAMAMLANDI! 🏆", "var(--success)");
                    createConfetti();
                    setTimeout(kaydetVeCik, 2000);
                } else {
                    // Oyun devam ediyorsa PUAN GÜNCELLE mesajı gönder (Pencere kapanmaz)
                    window.parent.postMessage({ islem: 'puan_guncelle', puan: score, limit: HEDEF_PUAN }, '*');
                    
                    showFeedback("Tebrikler! Doğru Bildin 🌟", "var(--success)");
                    setTimeout(() => {
                        currentQuestionIndex++;
                        loadQuestion();
                    }, 1500);
                }
            } else {
                btn.classList.add('wrong');
                questionBox.classList.add('shake');
                showFeedback("Tekrar Dene! 💪", "var(--danger)");
                
                Array.from(optionsBox.children).forEach(b => {
                    if (b.innerText === correct) b.classList.add('correct');
                });

                setTimeout(() => {
                    loadQuestion(); 
                }, 2000);
            }
        }

        function kaydetVeCik() {
            window.parent.postMessage({ islem: 'gorev_bitti', puan: score, limit: HEDEF_PUAN }, '*');
            
            document.getElementById('game-container').innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; text-align: center;">
                    <h2 style="color: var(--primary); font-size: 2.5rem; margin-bottom: 10px;">Harika! 🎉</h2>
                    <p style="font-size: 1.5rem; margin: 10px 0;">Kazanılan Puan: <strong style="color: var(--secondary); font-size: 3rem;">${score}</strong></p>
                    <p style="color: #666; font-size: 1rem; margin-top: 20px;">Sonucunuz kaydedildi.<br>Pencere kapatılıyor...</p>
                </div>
            `;
            
            for(let i=0; i<3; i++) setTimeout(createConfetti, i*300);
            if(particles.length === 0) updateConfetti();
        }

        let particles = [];
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: -10,
                    size: Math.random() * 8 + 4,
                    color: `hsl(${Math.random() * 360}, 70%, 60%)`,
                    speedY: Math.random() * 3 + 2,
                    speedX: Math.random() * 4 - 2,
                    rotation: Math.random() * 360
                });
            }
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.y += p.speedY;
                p.x += p.speedX;
                p.rotation += 5;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                ctx.restore();
                if (p.y > canvas.height) particles.splice(index, 1);
            });
            if (particles.length > 0) requestAnimationFrame(updateConfetti);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        loadQuestion();
    </script>
</body>
</html>
