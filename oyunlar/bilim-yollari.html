<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilimsel bilgiye ulaşma yolları</title>
<link rel="stylesheet" href="motor/oyun.css">
</head>
<body>
<script type="module">
import { secmeli, karistir } from './motor/oyun.js';

// Durumlar ve hangi bilimsel yöntem oldukları (öğretmenin listesi)
const SORULAR = [
        {
            q: "Gökyüzüne baktın, gri bulutları gördün ve rüzgârın estiğini fark ettin. 'Yağmur yağabilir.' diye düşünmen hangi bilimsel yöntemdir?",
            options: ["Tahmin Etme", "Deney Yapma", "Belge Taraması", "Model Oluşturma"],
            answer: "Tahmin Etme"
        },
        {
            q: "Okul bahçesindeki karıncaların yuvalarına yiyecek taşıdığını üç gün boyunca dikkatlice takip edip inceledin. Bu yöntem hangisidir?",
            options: ["Gözlem Yapma", "İletişim Kurma", "Tahmin Etme", "Model Oluşturma"],
            answer: "Gözlem Yapma"
        },
        {
            q: "Güneş, Dünya ve Ay'ın büyüklüklerini karşılaştırmak için oyun hamuruyla onların bir benzerini yaptın. Bu yöntem hangisidir?",
            options: ["Model Oluşturma", "Deney Yapma", "Gözlem Yapma", "Belge Taraması"],
            answer: "Model Oluşturma"
        },
        {
            q: "Büyüklerinin çocukluğunda neler yaptıklarını öğrenmek için onların eski günlüklerini ve okul fotoğraflarını inceledin. Bu yöntem hangisidir?",
            options: ["Belge Taraması", "Model Oluşturma", "Tahmin Etme", "Deney Yapma"],
            answer: "Belge Taraması"
        },
        {
            q: "Dondurmanın erime hızının farklı ortamlarda değişip değişmeyeceğini görmek için buzluktan çıkardığın dondurmayı test ettin. Bu yöntem hangisidir?",
            options: ["Deney Yapma", "İletişim Kurma", "Belge Taraması", "Model Oluşturma"],
            answer: "Deney Yapma"
        },
        {
            q: "Dengeli ve sağlıklı beslenme hakkında doğru bilgi almak için bir doktora veya sağlık çalışanına sorular sordun. Bu yöntem hangisidir?",
            options: ["İletişim Kurma", "Gözlem Yapma", "Tahmin Etme", "Deney Yapma"],
            answer: "İletişim Kurma"
        }
];

const IKON = { 'Tahmin Etme': '🤔', 'Deney Yapma': '🧪', 'Belge Taraması': '📜', 'Model Oluşturma': '🧩', 'Gözlem Yapma': '🔍', 'İletişim Kurma': '💬' };

secmeli({
    baslik: 'Bilimsel bilgiye ulaşma yolları', maskot: '🧑‍🔬', renk: '#0d9488',
    nasil: 'Durumu oku, hangi bilimsel yöntem kullanılmış bul. Yanlış şık kapanır, doğrusunu bulana kadar dene',
    hedefYazi: 'Hedef: 60 puan',
    mod: 'hedef', hedef: 60, limit: 60, dogruPuan: 10, soruBoyu: 'metin',
    sorular: () => karistir(SORULAR).map(s => ({
        soru: s.q, dogru: s.answer,
        secenekler: karistir(s.options).map(o => ({ deger: o, yazi: `${IKON[o] || ''} ${o}`.trim() })),
    })),
});
</script>
</body>
</html>
