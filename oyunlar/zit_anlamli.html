const kucuk = (s) => s.toLocaleLowerCase('tr-TR');
// Yanlış şıklar: doğru cevap, sorulan kelime ve onunla aynı anlama gelen kelimeler şık olmaz
function siklar(k) {
    const yasak = new Set([k.kelime, k.zit].map(kucuk));
    KELIMELER.forEach(x => { if (kucuk(x.kelime) === kucuk(k.kelime) || kucuk(x.zit) === kucuk(k.kelime)) { yasak.add(kucuk(x.zit)); yasak.add(kucuk(x.kelime)); } });
    const havuz = karistir([...new Set(KELIMELER.map(x => x.zit))].filter(c => !yasak.has(kucuk(c))));
    return karistir([k.zit, ...havuz.slice(0, 3)]);
}

    sorular: () => karistir(KELIMELER).slice(0, 20).map(k => ({
