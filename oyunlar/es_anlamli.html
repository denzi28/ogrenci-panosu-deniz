const kucuk = (s) => s.toLocaleLowerCase('tr-TR');
// Yanlış şıklar: doğru cevap, sorulan kelime ve onunla aynı anlama gelen kelimeler şık olmaz
function siklar(k) {
    const yasak = new Set([k.kelime, k.esAnlamli].map(kucuk));
    KELIMELER.forEach(x => { if (kucuk(x.kelime) === kucuk(k.kelime) || kucuk(x.esAnlamli) === kucuk(k.kelime)) { yasak.add(kucuk(x.esAnlamli)); yasak.add(kucuk(x.kelime)); } });
    const havuz = karistir([...new Set(KELIMELER.map(x => x.esAnlamli))].filter(c => !yasak.has(kucuk(c))));
    return karistir([k.esAnlamli, ...havuz.slice(0, 3)]);
}
