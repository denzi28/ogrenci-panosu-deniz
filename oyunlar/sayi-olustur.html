<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3 basamaklı sayı oluşturma</title>
<link rel="stylesheet" href="motor/oyun.css">
<style>
    .hedef { font-size: clamp(28px, 6vw, 48px); font-weight: 600; }
    .hedef b { color: var(--renk); }
    .hedef b.kucuk { color: #db2777; }
    .yuvalar { display: flex; justify-content: center; gap: clamp(8px, 2vw, 16px); margin-top: 16px; }
    .yuva { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .yuva small { font-size: 15px; color: var(--soluk); font-weight: 500; }
    .yuva button { width: clamp(76px, 15vw, 110px); height: clamp(88px, 17vw, 124px); border-radius: 22px; border: 4px dashed color-mix(in srgb, var(--renk) 45%, #fff); background: var(--renk-acik); font-size: clamp(48px, 9vw, 72px); font-weight: 600; color: var(--murekkep); }
    .yuva button.dolu { border-style: solid; border-color: var(--renk); background: #fff; box-shadow: 0 5px 0 color-mix(in srgb, var(--renk) 35%, #ddd); }
    .yuva button.sirada { border-color: var(--renk); }
    .rakamlar { display: flex; justify-content: center; gap: clamp(12px, 3vw, 24px); min-height: 110px; }
    .rakam { width: clamp(84px, 16vw, 116px); height: clamp(84px, 16vw, 116px); border-radius: 50%; background: #fff; border: 4px solid color-mix(in srgb, var(--renk) 30%, #fff); box-shadow: 0 6px 0 color-mix(in srgb, var(--renk) 35%, #ddd); font-size: clamp(44px, 8vw, 64px); font-weight: 600; transition: transform 150ms var(--yay), opacity 150ms; }
    .rakam:active { transform: translateY(5px); box-shadow: 0 1px 0 #ddd; }
    .rakam.kullanildi { opacity: 0; transform: scale(.5); pointer-events: none; }
    .eylemler { display: flex; justify-content: center; gap: 12px; }
    .eylemler .dev-dugme { margin: 0; width: auto; padding: 0 32px; min-height: 64px; font-size: 24px; }
    .eylemler .dev-dugme.ikincil { background: #fff; color: var(--soluk); box-shadow: 0 7px 0 #e2dcec; }
</style>
</head>
<body>
<script type="module">
import { Oyun, karistir, oynat, ses } from './motor/oyun.js';

const HEDEF_PUAN = 100, DOGRU_PUAN = 10, YANLIS_PUAN = 5;
let soruNo = 1, rakamlar = [], hedef = 'BÜYÜK', dogruCevap = '', yuvalar = [null, null, null], kilit = false;

const oyun = new Oyun({
    baslik: '3 basamaklı sayı oluşturma', maskot: '🦊', renk: '#4f46e5',
    nasil: 'Rakamlara dokunarak yazılabilecek en büyük ya da en küçük sayıyı oluştur. Yanlışta 5 puan gider',
    hedefYazi: 'Hedef: 100 puan',
    toplam: HEDEF_PUAN, ilerlemeTuru: 'puan', limit: HEDEF_PUAN, bitirDugmesi: true, canliKayit: true,
    baslat: () => {
        oyun.alan.innerHTML = `
            <div class="soru-kart">
                <div class="hedef">Yazılabilecek <b id="hedef"></b> sayı</div>
                <div class="yuvalar">${['Yüzler', 'Onlar', 'Birler'].map((ad, i) => `<div class="yuva"><button type="button" data-yuva="${i}" aria-label="${ad} basamağı"></button><small>${ad}</small></div>`).join('')}</div>
            </div>
            <div class="rakamlar" id="rakamlar"></div>
            <div class="eylemler">
                <button type="button" class="dev-dugme ikincil" id="temizle">Temizle</button>
                <button type="button" class="dev-dugme" id="kontrol">Kontrol et</button>
            </div>`;
        oyun.alan.querySelector('#rakamlar').addEventListener('click', (e) => { const r = e.target.closest('.rakam'); if (r) yerlestir(+r.dataset.i); });
        oyun.alan.querySelector('.yuvalar').addEventListener('click', (e) => { const y = e.target.closest('[data-yuva]'); if (y) geriAl(+y.dataset.yuva); });
        oyun.alan.querySelector('#temizle').addEventListener('click', () => { if (!kilit) { yuvalar = [null, null, null]; ciz(); } });
        oyun.alan.querySelector('#kontrol').addEventListener('click', kontrol);
        document.addEventListener('keydown', (e) => {
            if (document.querySelector('.perde') || kilit) return;
            if (/^[0-9]$/.test(e.key)) { const i = rakamlar.findIndex((r, j) => r === +e.key && !yuvalar.includes(j)); if (i >= 0) yerlestir(i); }
            else if (e.key === 'Backspace') { const son = yuvalar.map(x => x !== null).lastIndexOf(true); if (son >= 0) geriAl(son); }
            else if (e.key === 'Enter') kontrol();
        });
        yeniSoru();
    },
});

function yeniSoru() {
    // 3., 7. ve 9. sorularda rakamlardan biri 0 olur (en küçük sayıda 0 başa yazılamaz)
    const r = [3, 7, 9].includes(soruNo) ? [0] : [];
    while (r.length < 3) { const x = Math.floor(Math.random() * 10); if (!r.includes(x)) r.push(x); }
    rakamlar = karistir(r);
    hedef = Math.random() > 0.5 ? 'BÜYÜK' : 'KÜÇÜK';
    const s = [...rakamlar].sort((x, y) => hedef === 'BÜYÜK' ? y - x : x - y);
    if (hedef === 'KÜÇÜK' && s[0] === 0) [s[0], s[1]] = [s[1], s[0]];
    dogruCevap = s.join('');
    yuvalar = [null, null, null]; kilit = false;
    const h = oyun.alan.querySelector('#hedef');
    h.textContent = hedef === 'BÜYÜK' ? 'en büyük' : 'en küçük';
    h.className = hedef === 'BÜYÜK' ? '' : 'kucuk';
    ciz();
    oynat(oyun.alan.querySelector('.soru-kart'), 'gelis');
}

function ciz() {
    oyun.alan.querySelector('#rakamlar').innerHTML = rakamlar.map((r, i) =>
        `<button type="button" class="rakam${yuvalar.includes(i) ? ' kullanildi' : ''}" data-i="${i}" aria-label="${r}">${r}</button>`).join('');
    const sira = yuvalar.indexOf(null);
    oyun.alan.querySelectorAll('[data-yuva]').forEach((b, i) => {
        b.textContent = yuvalar[i] !== null ? rakamlar[yuvalar[i]] : '';
        b.classList.toggle('dolu', yuvalar[i] !== null);
        b.classList.toggle('sirada', i === sira);
    });
}

function yerlestir(i) {
    if (kilit || yuvalar.includes(i)) return;
    const bos = yuvalar.indexOf(null);
    if (bos < 0) return;
    ses.tik();
    yuvalar[bos] = i;
    ciz();
    oynat(oyun.alan.querySelector(`[data-yuva="${bos}"]`), 'zipla');
}
function geriAl(y) { if (kilit || yuvalar[y] === null) return; yuvalar[y] = null; ciz(); }

function kontrol() {
    if (kilit || oyun.bitti) return;
    if (yuvalar.includes(null)) { ses.uyari(); oyun.ovgu('Önce üç kutuyu doldur', 'kotu'); return; }
    const cevap = yuvalar.map(i => rakamlar[i]).join('');
    const kart = oyun.alan.querySelector('.yuvalar');
    kilit = true;
    if (cevap === dogruCevap) {
        soruNo++;
        oyun.dogru(kart, { puan: DOGRU_PUAN });
        if (oyun.puan >= HEDEF_PUAN) return setTimeout(() => oyun.bitir(), 1000);
        setTimeout(yeniSoru, 1100);
    } else {
        oyun.yanlis(kart, { ceza: YANLIS_PUAN });
        setTimeout(() => { yuvalar = [null, null, null]; kilit = false; ciz(); }, 800);
    }
}
</script>
</body>
</html>
