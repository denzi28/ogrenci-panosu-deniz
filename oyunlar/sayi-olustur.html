<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3 Basamaklı Sayı Oluşturma Oyunu</title>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #eff6ff;
            --text: #1e293b;
            --slot-bg: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            position: relative;
        }

        /* Üst Bilgi Çubuğu */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.15);
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .logout-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #2563eb;
            transition: 0.1s;
        }

        .logout-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #2563eb;
        }

        /* Soru Alanı */
        .question-card {
            background: white;
            padding: 20px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .instruction {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--text);
        }

        .highlight {
            color: var(--danger);
            font-weight: 900;
            font-size: 1.5rem;
            text-transform: uppercase;
        }

        /* Kaynak Rakamlar Alanı */
        .source-zone {
            display: flex;
            justify-content: center;
            gap: 15px;
            min-height: 80px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 15px;
            border: 2px dashed #cbd5e1;
            margin-bottom: 20px;
        }

        /* Hedef Basamaklar Alanı */
        .slots-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .slot-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .slot {
            width: 80px;
            height: 90px;
            background: var(--slot-bg);
            border: 3px dashed #94a3b8;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }

        .slot.drag-over {
            background: #fef08a;
            border-color: var(--secondary);
            transform: scale(1.05);
        }

        .slot-label {
            font-weight: bold;
            color: #64748b;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        /* Sürüklenebilir Rakamlar */
        .digit {
            width: 70px;
            height: 80px;
            background: var(--primary);
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            box-shadow: 0 5px 0 #1d4ed8;
            cursor: grab;
            transition: transform 0.1s;
        }

        .digit:active {
            cursor: grabbing;
        }

        .digit.selected {
            border: 4px solid var(--secondary);
            transform: scale(1.1);
        }

        /* Kontrol Butonu */
        .check-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 0 #047857;
            width: 100%;
            transition: 0.1s;
        }

        .check-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #047857;
        }

        /* Geri Bildirim ve Animasyonlar */
        #feedback {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.5rem;
            color: white;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake { animation: shake 0.4s ease-in-out; }

        #canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 99;
        }

        .mobile-tip {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        
        .soru-sayaci {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div id="feedback"></div>

    <div id="game-container">
        <div class="stats-bar">
            <div>🏆 Puan: <span id="score">0</span> / 100 <br><span class="soru-sayaci" id="soru-sayaci">Soru: 1</span></div>
            <button class="logout-btn" onclick="kaydetVeCik()">Kaydet ve Çık</button>
        </div>

        <div class="question-card" id="question-box">
            <div class="instruction">
                Aşağıdaki rakamları kullanarak oluşturulabilecek <br>
                <span class="highlight" id="target-type">EN BÜYÜK</span> <br>
                3 basamaklı sayıyı oluştur!
            </div>
            
            <div class="mobile-tip">💡 İpucu: Sürükleyip bırakabilir veya önce rakama sonra kutuya dokunabilirsin.</div>

            <div class="source-zone" id="source-zone">
                <!-- Rakamlar buraya gelecek -->
            </div>

            <div class="slots-container">
                <div class="slot-wrapper">
                    <div class="slot" data-type="slot"></div>
                    <div class="slot-label">Yüzler</div>
                </div>
                <div class="slot-wrapper">
                    <div class="slot" data-type="slot"></div>
                    <div class="slot-label">Onlar</div>
                </div>
                <div class="slot-wrapper">
                    <div class="slot" data-type="slot"></div>
                    <div class="slot-label">Birler</div>
                </div>
            </div>

            <button class="check-btn" onclick="checkAnswer()">Kontrol Et ✔️</button>
        </div>
    </div>

    <script>
        const HEDEF_PUAN = 100;
        const DOGRU_PUAN = 10;
        const YANLIS_PUAN = 5;
        let score = 0;
        let questionNumber = 1; // Soru Sayacı eklendi
        let currentTarget = ""; // "BÜYÜK" veya "KÜÇÜK"
        let currentDigits = [];
        let correctAnswer = "";

        const scoreEl = document.getElementById('score');
        const soruSayaciEl = document.getElementById('soru-sayaci');
        const sourceZone = document.getElementById('source-zone');
        const slots = document.querySelectorAll('.slot');
        const targetTypeEl = document.getElementById('target-type');
        const feedbackEl = document.getElementById('feedback');
        const questionBox = document.getElementById('question-box');
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Soru Üretici
        function loadQuestion() {
            currentDigits = [];
            
            // ÖZEL KURAL: 3., 7. ve 9. sorularda garantili olarak "0" rakamı eklenir
            if (questionNumber === 3 || questionNumber === 7 || questionNumber === 9) {
                currentDigits.push(0);
            }

            // Kalan boşlukları rastgele rakamlarla (0-9) doldur
            while (currentDigits.length < 3) {
                let r = Math.floor(Math.random() * 10); 
                if (!currentDigits.includes(r)) currentDigits.push(r);
            }
            
            // Sıfırın hep en başta görünmesini engellemek için karıştır
            currentDigits.sort(() => Math.random() - 0.5);

            // Hedefi belirle
            currentTarget = Math.random() > 0.5 ? "BÜYÜK" : "KÜÇÜK";
            targetTypeEl.innerText = `EN ${currentTarget}`;
            targetTypeEl.style.color = currentTarget === "BÜYÜK" ? "var(--primary)" : "var(--danger)";

            // Doğru cevabı matematik kurallarına göre hesapla
            let sortedDigits = [...currentDigits];
            if (currentTarget === "BÜYÜK") {
                sortedDigits.sort((a, b) => b - a); // Büyükten küçüğe
            } else {
                sortedDigits.sort((a, b) => a - b); // Küçükten büyüğe
                
                // KRİTİK KURAL: 3 basamaklı sayı 0 ile başlayamaz!
                if (sortedDigits[0] === 0) {
                    let temp = sortedDigits[0];
                    sortedDigits[0] = sortedDigits[1]; // Sıfırı onlar basamağına kaydır
                    sortedDigits[1] = temp;            // En küçük rakamı yüzler basamağına al
                }
            }
            correctAnswer = sortedDigits.join('');

            // Arayüzü temizle
            sourceZone.innerHTML = '';
            slots.forEach(slot => slot.innerHTML = '');
            soruSayaciEl.innerText = `Soru: ${questionNumber}`;

            // Rakamları ekrana bas ve sürükleme özelliklerini ekle
            currentDigits.forEach(num => {
                const div = document.createElement('div');
                div.className = 'digit';
                div.innerText = num;
                div.draggable = true;
                
                div.addEventListener('dragstart', dragStart);
                div.addEventListener('dragend', dragEnd);
                div.addEventListener('click', selectForMobile);

                sourceZone.appendChild(div);
            });
        }

        // --- SÜRÜKLE BIRAK (DRAG & DROP) MANTIĞI ---
        let draggedItem = null;
        let selectedItem = null; 

        function dragStart(e) {
            draggedItem = this;
            setTimeout(() => this.style.opacity = '0.5', 0);
        }

        function dragEnd() {
            setTimeout(() => this.style.opacity = '1', 0);
            draggedItem = null;
            slots.forEach(s => s.classList.remove('drag-over'));
        }

        slots.forEach(slot => {
            slot.addEventListener('dragover', (e) => {
                e.preventDefault();
                slot.classList.add('drag-over');
            });

            slot.addEventListener('dragleave', () => {
                slot.classList.remove('drag-over');
            });

            slot.addEventListener('drop', (e) => {
                e.preventDefault();
                slot.classList.remove('drag-over');
                if (draggedItem) dropItemToSlot(draggedItem, slot);
            });

            slot.addEventListener('click', () => {
                if (selectedItem) dropItemToSlot(selectedItem, slot);
            });
        });

        sourceZone.addEventListener('dragover', (e) => e.preventDefault());
        sourceZone.addEventListener('drop', (e) => {
            e.preventDefault();
            if (draggedItem) sourceZone.appendChild(draggedItem);
        });
        sourceZone.addEventListener('click', () => {
            if (selectedItem) {
                sourceZone.appendChild(selectedItem);
                clearSelection();
            }
        });

        function dropItemToSlot(item, slot) {
            if (slot.children.length > 0) {
                sourceZone.appendChild(slot.children[0]);
            }
            slot.appendChild(item);
            clearSelection();
        }

        function selectForMobile(e) {
            if (selectedItem === this) {
                clearSelection(); 
            } else {
                clearSelection();
                selectedItem = this;
                this.classList.add('selected');
            }
        }

        function clearSelection() {
            if (selectedItem) selectedItem.classList.remove('selected');
            selectedItem = null;
        }

        // --- KONTROL VE PUANLAMA MANTIĞI ---
        function showFeedback(text, color) {
            feedbackEl.innerHTML = text;
            feedbackEl.style.backgroundColor = color;
            feedbackEl.style.display = 'block';
            setTimeout(() => feedbackEl.style.display = 'none', 1500);
        }

        function checkAnswer() {
            let isFull = true;
            let userAnswer = "";
            slots.forEach(slot => {
                if (slot.children.length === 0) isFull = false;
                else userAnswer += slot.children[0].innerText;
            });

            if (!isFull) {
                showFeedback("Lütfen tüm kutuları doldur! ⚠️", "var(--secondary)");
                return;
            }

            if (userAnswer === correctAnswer) {
                // DOĞRU
                score += DOGRU_PUAN;
                questionNumber++; 
                scoreEl.innerText = score;
                
                // Arka planda kaydet (Pencere kapanmaz)
                window.parent.postMessage({ islem: 'puan_guncelle', puan: score, limit: HEDEF_PUAN }, '*');

                if (score >= HEDEF_PUAN) {
                    // Oyun Bitti
                    window.parent.postMessage({ islem: 'gorev_bitti', puan: score, limit: HEDEF_PUAN }, '*');
                    showFeedback("GÖREV TAMAMLANDI! 🏆", "var(--success)");
                    createConfetti();
                    setTimeout(kaydetVeCik, 2000);
                } else {
                    // Sonraki Soru
                    showFeedback("Harika! Doğru Bildin 🌟", "var(--success)");
                    createConfetti();
                    if(particles.length <= 50) updateConfetti();
                    setTimeout(loadQuestion, 1500);
                }
            } else {
                // YANLIŞ
                score -= YANLIS_PUAN;
                if(score < 0) score = 0; // Puan 0'ın altına düşmesin
                scoreEl.innerText = score;
                
                window.parent.postMessage({ islem: 'puan_guncelle', puan: score, limit: HEDEF_PUAN }, '*');
                
                questionBox.classList.add('shake');
                showFeedback("Yanlış! Tekrar Dene 💪", "var(--danger)");
                
                setTimeout(() => {
                    questionBox.classList.remove('shake');
                    // Yanlış yapınca rakamları başa (kaynağa) geri gönder
                    slots.forEach(slot => {
                        if (slot.children.length > 0) sourceZone.appendChild(slot.children[0]);
                    });
                }, 800);
            }
        }

        function kaydetVeCik() {
            window.parent.postMessage({ islem: 'gorev_bitti', puan: score, limit: HEDEF_PUAN }, '*');
            document.getElementById('game-container').innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; text-align: center;">
                    <h2 style="color: var(--primary); font-size: 2.5rem; margin-bottom: 10px;">Harika! 🎉</h2>
                    <p style="font-size: 1.5rem; margin: 10px 0;">Kazanılan Puan: <strong style="color: var(--success); font-size: 3rem;">${score}</strong></p>
                    <p style="color: #666; font-size: 1rem; margin-top: 20px;">Sonucunuz kaydedildi.<br>Pencere kapatılıyor...</p>
                </div>
            `;
            for(let i=0; i<3; i++) setTimeout(createConfetti, i*300);
            if(particles.length === 0) updateConfetti();
        }

        // --- KONFETİ ANİMASYONU ---
        let particles = [];
        function createConfetti() {
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: -10,
                    size: Math.random() * 8 + 4,
                    color: `hsl(${Math.random() * 360}, 70%, 60%)`,
                    speedY: Math.random() * 3 + 2,
                    speedX: Math.random() * 4 - 2,
                    rotation: Math.random() * 360
                });
            }
        }
        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.y += p.speedY; p.x += p.speedX; p.rotation += 5;
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color; ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size); ctx.restore();
                if (p.y > canvas.height) particles.splice(index, 1);
            });
            if (particles.length > 0) requestAnimationFrame(updateConfetti);
        }

        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        // Oyunu Başlat
        loadQuestion();
    </script>
</body>
</html>
