<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canlıların ortak özellikleri</title>
<link rel="stylesheet" href="motor/oyun.css">
</head>
<body>
<script type="module">
import { secmeli, karistir } from './motor/oyun.js';

// Durumlar ve hangi canlılık özelliğine örnek oldukları (öğretmenin listesi)
const SORULAR = [
        { metin: "Tavukların yumurtlayarak yeni civcivler dünyaya getirmesi.", cevap: "Üreme", ikon: "🐔" },
        { metin: "İnsanların spor yaparken terleyerek vücutlarındaki fazla suyu atması.", cevap: "Boşaltım", ikon: "💦" },
        { metin: "Kaplumbağaların tehlike anında başını kabuğunun içine çekerek saklanması.", cevap: "Tepki Verme", ikon: "🐢" },
        { metin: "Balıkların solungaçları ile sudan oksijen alarak yaşamaya devam etmesi.", cevap: "Solunum", ikon: "🐟" },
        { metin: "Kuşların gökyüzünde kanat çırparak bir yerden bir yere uçması.", cevap: "Hareket Etme", ikon: "🦅" },
        { metin: "İneklerin çayırlarda karınlarını doyurmak için taze ot yemesi.", cevap: "Beslenme", ikon: "🐄" },
        { metin: "Küçük bir fidanın zamanla büyüyerek kocaman bir ağaç olması.", cevap: "Büyüme", ikon: "🌳" },
        { metin: "Kedilerin sevimli yavrular doğurarak çoğalması.", cevap: "Üreme", ikon: "🐈" },
        { metin: "Vücudumuzdaki zararlı atıkların idrar veya ter yoluyla dışarı atılması.", cevap: "Boşaltım", ikon: "💧" },
        { metin: "Sıcak bir çaydanlığa dokununca elimizi hızla geri çekmemiz.", cevap: "Tepki Verme", ikon: "☕" },
        { metin: "İnsanların akciğerlerine hava çekip sürekli nefes alıp vermesi.", cevap: "Solunum", ikon: "🫁" },
        { metin: "Bir çitanın ormanda bir yerden başka bir yere çok hızlı koşması.", cevap: "Hareket Etme", ikon: "🐆" },
        { metin: "Tırtılların kelebek olabilmek için sürekli yaprak yemesi.", cevap: "Beslenme", ikon: "🐛" },
        { metin: "Yeni doğan bir bebeğin yıllar geçtikçe büyüyüp yetişkin bir insan olması.", cevap: "Büyüme", ikon: "👶" }
];

const OZELLIKLER = [
    { deger: 'Büyüme', yazi: '🌱 Büyüme', renk: '#16a34a' },
    { deger: 'Boşaltım', yazi: '💧 Boşaltım', renk: '#0284c7' },
    { deger: 'Beslenme', yazi: '🍎 Beslenme', renk: '#dc2626' },
    { deger: 'Solunum', yazi: '💨 Solunum', renk: '#0d9488' },
    { deger: 'Tepki Verme', yazi: '⚡ Tepki verme', renk: '#ca8a04' },
    { deger: 'Hareket Etme', yazi: '🏃 Hareket etme', renk: '#9333ea' },
    { deger: 'Üreme', yazi: '🐣 Üreme', renk: '#db2777' },
];

secmeli({
    baslik: 'Canlıların ortak özellikleri', maskot: '🐸', renk: '#16a34a',
    nasil: 'Okuduğun durum hangi canlılık özelliğine örnek? Doğru özelliğe dokun',
    hedefYazi: '10 soru · her doğru 10 puan',
    soruSayisi: 10, limit: 100, dogruPuan: 10, soruBoyu: 'metin', duzen: 'kategori',
    sorular: () => karistir(SORULAR).slice(0, 10).map(s => ({
        ikon: s.ikon, soru: s.metin, secenekler: OZELLIKLER, dogru: s.cevap,
    })),
});
</script>
</body>
</html>
