<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayıları karşılaştırma</title>
<link rel="stylesheet" href="motor/oyun.css">
</head>
<body>
<script type="module">
import { secmeli, rastgele } from './motor/oyun.js';

// %20 ihtimalle eşit sayılar gelir (çocuklar "=" işaretini de sık görsün)
function soruUret() {
    const a = rastgele(100, 999);
    let b = a;
    if (Math.random() >= 0.2) while (b === a) b = rastgele(100, 999);
    return {
        ust: 'Hangi işaret gelmeli?', soru: `${a} {?} ${b}`,
        dogru: a > b ? '>' : a < b ? '<' : '=',
        secenekler: [
            { deger: '<', yazi: '<', renk: '#2563eb' },
            { deger: '=', yazi: '=', renk: '#ca8a04' },
            { deger: '>', yazi: '>', renk: '#16a34a' },
        ],
    };
}

secmeli({
    baslik: 'Sayıları karşılaştırma', maskot: '🐊', renk: '#16a34a',
    nasil: 'Timsah hep büyük sayıyı yemek ister: ağzı büyük sayıya açılır. Doğruya 5 puan, yanlışta 3 puan gider',
    hedefYazi: '20 soru · her doğru 5 puan',
    soruSayisi: 20, limit: 100, dogruPuan: 5, yanlisCeza: 3, duzen: 'uc',
    sorular: () => Array.from({ length: 20 }, soruUret),
});
</script>
</body>
</html>
