        ust: 'Türkçe karşılığı nedir?', soru: k.yabanci, dogru: k.turkce,
        secenekler: karistir([k.turkce, ...karistir([...new Set(KELIMELER.map(x => x.turkce))].filter(t => t !== k.turkce)).slice(0, 3)]),
